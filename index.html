*{box-sizing:border-box}html,body{margin:0;background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI','Microsoft JhengHei',sans-serif;font-size:18px;line-height:1.5}button,input,select{font:inherit}button,summary,select{cursor:pointer}button{min-height:48px;border-radius:10px}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,svg g:focus-visible{outline:3px solid #2563eb;outline-offset:3px}button:active{transform:translateY(1px)}

.workspace{max-width:960px;margin:auto;padding:24px 20px 40px}.intro-line{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:12px}.intro-line>span:first-child{font-weight:800;color:var(--ink);font-size:15px}.quick-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick-nav button{position:relative;display:flex;gap:8px;align-items:center;justify-content:center;min-height:64px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:16px;font-weight:700}.quick-nav button[aria-current=page]{background:#163f88;color:#fff;border-color:#163f88;box-shadow:0 4px 12px #163f8820}.quick-nav small{font-size:11px;opacity:.6}.module-select{display:flex;gap:12px;align-items:center;justify-content:flex-end;margin:14px 0 18px;font-size:13px;color:var(--muted)}.module-select select{min-height:44px;max-width:240px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font-size:15px}
.main-panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:var(--shadow)}.quick-module{display:flex;flex-direction:column;gap:18px}.module-title .eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.08em}.module-title h2{font-size:27px;line-height:1.25;font-weight:800;margin:5px 0 8px}.module-title p{font-size:15px;color:var(--muted);margin:0}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.quick-result{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--soft);min-width:0;display:flex;flex-direction:column;gap:4px}.quick-result.primary{background:var(--blue-soft);border-color:#9fb9dc}.quick-result>span{font-size:14px;font-weight:650;color:var(--muted)}.quick-result strong{font-size:38px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap}.quick-result.primary strong{color:var(--blue)}.quick-result small{font-size:15px;font-weight:500;margin-left:6px}.quick-result .result-sub{font-size:13px;font-weight:500}.angle-summary{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--muted);font-size:13px}.angle-summary b{color:var(--ink);font-weight:750;margin-left:4px}

.input-panel{display:flex;flex-direction:column;gap:14px;padding:18px;background:var(--soft);border:1px solid var(--line);border-radius:14px}.numeric-field{min-width:0}.numeric-field>label{display:block;font-size:15px;font-weight:700;margin-bottom:8px;color:var(--ink)}.number-entry{display:flex;align-items:center;gap:8px}.number-entry button{width:46px;min-width:46px;min-height:48px;background:var(--surface);border:1px solid var(--line);color:var(--blue);font-size:22px;font-weight:600}.number-entry input{min-width:0;flex:1;width:80px;border:1px solid #9fb1c9;border-radius:9px;background:var(--surface);color:var(--ink);min-height:48px;padding:8px 10px;text-align:center;font-size:22px;font-weight:750;font-variant-numeric:tabular-nums}.number-entry span{font-size:15px;color:var(--muted);min-width:26px}.numeric-field input[type=range]{width:100%;height:32px;margin:6px 0 0;accent-color:#163f88;cursor:pointer}.field-hint{font-size:13px;color:var(--muted)}.preset-label{font-size:14px;font-weight:650}.preset-row{display:flex;flex-wrap:wrap;gap:8px}.preset-row button{flex:1;min-width:54px;min-height:48px;padding:8px 12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);font-size:15px;font-weight:650}.preset-row button[aria-pressed=true],.diagram-tools button[aria-pressed=true]{background:#163f88;color:#fff;border-color:#163f88}.reference{border-top:1px solid var(--line);font-size:15px;color:var(--muted)}.reference summary{color:var(--ink)}.reference p{margin:0 0 12px;line-height:1.7}.point-fields{padding:16px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:12px}.point-fields>b{grid-column:1/-1;color:var(--ink)}.warning{background:#fff3dc;color:#78350f;border:1px solid #d6a44b;border-radius:10px;padding:12px;font-size:15px}footer{margin-top:24px;font-size:13px;line-height:1.7;text-align:center;color:var(--muted)}footer span{font-size:12px}

@media(max-width:480px){.site-header{padding:14px 16px}.brand h1{font-size:22px}.workspace{padding:18px 14px 32px}.quick-nav{gap:6px}.quick-nav button{font-size:14px;gap:5px;min-height:62px}.quick-nav small{display:none}.quick-nav svg{width:17px}.main-panel{padding:18px 14px;border-radius:16px}.module-title h2{font-size:25px}.module-title p{font-size:15px}.result-grid{gap:8px}.quick-result{padding:14px 12px}.quick-result strong{font-size:32px}.quick-result small{font-size:13px}.quick-result>span{font-size:13px}.input-panel{padding:14px}.angle-summary{gap:6px 12px}.point-fields{grid-template-columns:1fr}.point-fields>b{grid-column:auto}.intro-line{font-size:12px}.module-select{margin:12px 0 16px}.diagram-caption{gap:8px 12px}.preset-row button{padding:8px}.theme-toggle{font-size:13px;padding:0 10px}}

@media(max-width:600px){.workspace{padding-bottom:100px}.result-dock{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 20px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px #17263d10;z-index:60}.result-dock>div{display:flex;flex-direction:column}.result-dock span{font-size:12px;color:var(--muted)}.result-dock b{font-size:23px;color:var(--blue);font-variant-numeric:tabular-nums}.result-dock small{font-size:13px;font-weight:500}}
